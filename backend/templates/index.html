<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>{{ title }}</title><link rel="stylesheet" href="/static/styles.css"/></head><body><main>
<h1>{{ title }}</h1><p class="sub">Score leads with title/company rules + LLM boost.</p>
<div class="grid"><section class="card">
<form method="post" action="/ui/leads"><label>Email</label><input name="email" required/>
<label>Company</label><input name="company"/><label>Title</label><input name="title"/>
<label>Notes</label><textarea name="notes" rows="3"></textarea><button type="submit">Score</button></form>
</section><section class="card"><h2>Queue</h2>
{% for l in leads %}<div><span class="pill">{{ l.band }}</span> <span class="pill">{{ l.score }}</span> {{ l.email }} · {{ l.title }} @ {{ l.company }}</div>{% endfor %}
</section></div></main></body></html>
